aid: calamu-technologies
name: Calamu Technologies
description: 'Calamu Technologies is a data-first cybersecurity company founded in 2019
  and headquartered in Clinton, New Jersey. Its flagship product, Calamu Protect (Data
  Harbor), is a cyber vault for backup and recovery data that uses a patented process
  to fragment and scatter data across multiple storage locations, rendering it valueless
  ("Digital Sludge") to attackers even if breached and instantly reassembling it for
  authorized applications and users. Calamu integrates with enterprise backup platforms
  including Veeam, Veritas NetBackup, Dell EMC, Nutanix, Wasabi, and StarWind, and
  exposes an S3-compatible storage interface for data protection. The company is backed
  by Insight Partners.'
